<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Maker · 콩쥐야 줘때써</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="quiz-maker">
  <header class="tool-header">
    <div><p>DEVELOPER TOOL</p><h1>Quiz Maker</h1></div>
    <div class="header-actions"><span id="saveState" role="status">준비 중…</span><button id="newButton">새 문제</button><button id="duplicateButton">복제</button><button id="saveButton" class="primary">저장</button></div>
  </header>
  <main class="maker-grid">
    <aside class="panel metadata-panel">
      <h2>문제 메타데이터</h2>
      <label>과목<select id="subject"></select></label>
      <label>category<select id="category"></select></label>
      <button id="newCategoryButton" class="link-button">+ 새 category 추가</button>
      <fieldset id="newCategoryFields" hidden><legend>새 분류</legend><label>분류 ID<input id="newTrainingId"></label><label>표시 제목<input id="newTrainingTitle"></label><label>category 이름<input id="newCategoryName"></label></fieldset>
      <label>기존 문제<select id="existingQuestion"><option value="">새 문제</option></select></label>
      <label>난이도<select id="difficulty"><option value="1">1 · 쉬움</option><option value="2">2 · 보통</option><option value="3">3 · 어려움</option></select></label>
      <label>문제 ID<div class="inline"><input id="questionId"><button id="suggestIdButton">자동</button></div></label>
      <label>문제 형식<select id="questionType"></select></label>
      <label>태그<input id="tags" placeholder="쉼표로 구분"></label>
      <section class="asset-picker">
        <div class="section-title"><h3>사용 asset</h3><button id="clearAssetButton">연결 해제</button></div>
        <input id="assetSearch" type="search" placeholder="파일명 검색">
        <select id="assetFolder"><option value="">모든 폴더</option></select>
        <div id="assetGrid" class="asset-grid"></div>
        <img id="selectedAssetPreview" class="selected-asset" hidden alt="선택 asset 미리보기">
        <code id="assetPath">연결된 asset 없음</code>
        <label>이미지 대체 텍스트<input id="imageAlt"></label>
        <label>자료 표시 문구<input id="sourceLabel"></label>
      </section>
    </aside>

    <section class="panel editor-panel">
      <div class="section-title"><h2>문제 작성</h2><span id="editMode" class="badge">신규 추가</span></div>
      <label>문제 본문<textarea id="prompt" class="prompt-area"></textarea></label>
      <div class="section-title"><h3>선택지</h3><button id="addChoiceButton">+ 추가</button></div>
      <div id="choices" class="choices-editor"></div>
      <label id="directAnswerLabel" hidden>정답<input id="directAnswer"></label>
      <label>해설<textarea id="explanation" class="explanation-area"></textarea></label>
      <div id="validation" class="validation" aria-live="polite"></div>
      <details class="import-box"><summary>JSON Import</summary><textarea id="importText" placeholder="production question JSON"></textarea><button id="importButton">불러오기</button></details>
    </section>

    <aside class="panel preview-panel">
      <div class="section-title"><h2>실제 게임 미리보기</h2><div><button data-preview="pc" class="active">PC</button><button data-preview="mobile">Mobile</button></div></div>
      <div id="previewShell" class="preview-shell pc"><iframe id="previewFrame" src="./preview.html" title="실제 퀴즈 renderer 미리보기"></iframe></div>
      <p class="target-file">저장 대상: <code id="targetFile"></code></p>
      <details open><summary>JSON 보기 · production schema</summary><pre id="jsonPreview"></pre><div class="export-actions"><button id="copyJsonButton">JSON 복사</button><button id="downloadJsonButton">파일 저장</button></div></details>
    </aside>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
