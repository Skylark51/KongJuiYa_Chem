name: Fix blue scholar shop preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-blue-scholar-shop-preview.yml'

permissions:
  contents: write

concurrency:
  group: fix-blue-scholar-shop-preview
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch shop sprite preview slicing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/shop-navigation.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'const ASSET_VERSION = "20260814-outfit-shop3";',
              'const ASSET_VERSION = "20260815-blue-scholar-shop-gridfix1";'
          )

          marker = 'const OUTFIT_SPRITE_FRAME_COUNT = 8;\n'
          addition = '''const OUTFIT_SPRITE_FRAME_COUNT = 8;
          const OUTFIT_GRID_SPECS = Object.freeze({
            "blue-scholar": Object.freeze({ columns: 5, rows: 6 })
          });
          const OUTFIT_GRID_PREVIEW_CACHE = new Map();
          '''
          if marker not in text:
              raise SystemExit('outfit sprite constant marker not found')
          text = text.replace(marker, addition, 1)

          old_key_line = 'const isOutfitSprite = visualKey => OUTFIT_SPRITE_KEYS.has(visualKey);'
          new_key_lines = '''const isOutfitSprite = visualKey => OUTFIT_SPRITE_KEYS.has(visualKey);
          const gridSpecFor = visualKey => OUTFIT_GRID_SPECS[visualKey] || null;
          const isGridOutfitSprite = visualKey => Boolean(gridSpecFor(visualKey));'''
          if old_key_line not in text:
              raise SystemExit('isOutfitSprite marker not found')
          text = text.replace(old_key_line, new_key_lines, 1)

          clear_block = '''function clearSpriteFrameStyles(image) {
            SPRITE_OVERRIDE_PROPERTIES.forEach(property => image.style.removeProperty(property));
            image.removeAttribute("data-sprite-preview");
          }
          '''
          clear_replacement = '''function clearSpriteFrameStyles(image) {
            SPRITE_OVERRIDE_PROPERTIES.forEach(property => image.style.removeProperty(property));
            image.removeAttribute("data-sprite-preview");
            delete image.dataset.gridPreviewReady;
          }
          '''
          if clear_block not in text:
              raise SystemExit('clearSpriteFrameStyles block not found')
          text = text.replace(clear_block, clear_replacement, 1)

          apply_end = '''function applySpriteFrameStyles(image, container, { wardrobe = false } = {}) {
            const halfFramePercent = 100 / (OUTFIT_SPRITE_FRAME_COUNT * 2);
            container.style.position = "relative";
            container.style.overflow = "hidden";
            image.dataset.spritePreview = "first-frame";
            image.style.setProperty("position", "absolute", "important");
            image.style.setProperty("left", "50%", "important");
            image.style.setProperty("bottom", wardrobe ? "12px" : "0", "important");
            image.style.setProperty("width", "auto", "important");
            image.style.setProperty("height", wardrobe ? "calc(100% - 24px)" : "100%", "important");
            image.style.setProperty("max-width", "none", "important");
            image.style.setProperty("max-height", "none", "important");
            image.style.setProperty("padding", "0", "important");
            image.style.setProperty("object-fit", "fill", "important");
            image.style.setProperty("object-position", "left bottom", "important");
            image.style.setProperty("transform", `translateX(-${halfFramePercent}%)`, "important");
          }
          '''
          helper = apply_end + '''
          function renderGridSpritePreview(image, visualKey, frame = 0) {
            const spec = gridSpecFor(visualKey);
            if (!spec || image.dataset.gridPreviewReady === "true") return false;
            const width = image.naturalWidth;
            const height = image.naturalHeight;
            if (!width || !height) return false;

            const columns = Math.max(1, Number(spec.columns) || 1);
            const rows = Math.max(1, Number(spec.rows) || 1);
            const frameCount = columns * rows;
            const index = Math.max(0, Math.min(frameCount - 1, Number(frame) || 0));
            const column = index % columns;
            const row = Math.floor(index / columns);
            const cacheKey = `${visualKey}:${ASSET_VERSION}:${index}:${width}x${height}`;

            let previewSource = OUTFIT_GRID_PREVIEW_CACHE.get(cacheKey);
            if (!previewSource) {
              // Partition the source using integer pixel boundaries. 1024px is not
              // divisible by five, so percentage/background slicing creates visible
              // slivers. Rounded cumulative boundaries assign every source pixel to
              // exactly one frame without gaps or overlap.
              const x0 = Math.round(column * width / columns);
              const x1 = Math.round((column + 1) * width / columns);
              const y0 = Math.round(row * height / rows);
              const y1 = Math.round((row + 1) * height / rows);
              const frameWidth = Math.max(1, x1 - x0);
              const frameHeight = Math.max(1, y1 - y0);
              const canvas = document.createElement("canvas");
              canvas.width = frameWidth;
              canvas.height = frameHeight;
              const context = canvas.getContext("2d", { alpha: true });
              if (!context) return false;
              context.clearRect(0, 0, frameWidth, frameHeight);
              context.drawImage(
                image,
                x0, y0, frameWidth, frameHeight,
                0, 0, frameWidth, frameHeight
              );
              previewSource = canvas.toDataURL("image/png");
              OUTFIT_GRID_PREVIEW_CACHE.set(cacheKey, previewSource);
            }

            clearSpriteFrameStyles(image);
            image.dataset.gridPreviewReady = "true";
            image.dataset.spritePreview = "grid-first-frame";
            image.src = previewSource;
            return true;
          }
          '''
          if apply_end not in text:
              raise SystemExit('applySpriteFrameStyles block not found')
          text = text.replace(apply_end, helper, 1)

          text = text.replace(
              'if (isOutfitSprite(item.visualKey)) applySpriteFrameStyles(image, asset);\n  image.addEventListener("load", () => {\n    asset.dataset.assetState = "ready";\n  });',
              'if (isOutfitSprite(item.visualKey) && !isGridOutfitSprite(item.visualKey)) applySpriteFrameStyles(image, asset);\n  image.addEventListener("load", () => {\n    if (isGridOutfitSprite(item.visualKey) && renderGridSpritePreview(image, item.visualKey)) return;\n    asset.dataset.assetState = "ready";\n  });',
              1
          )

          text = text.replace(
              'if (isOutfitSprite(visualKey) && stage) applySpriteFrameStyles(image, stage, { wardrobe: true });\n  image.dataset.assetState = "loading";\n  image.alt = label;\n  image.onload = () => {\n    image.dataset.assetState = "ready";\n  };',
              'if (isOutfitSprite(visualKey) && !isGridOutfitSprite(visualKey) && stage) applySpriteFrameStyles(image, stage, { wardrobe: true });\n  image.dataset.assetState = "loading";\n  image.alt = label;\n  image.onload = () => {\n    if (isGridOutfitSprite(visualKey) && renderGridSpritePreview(image, visualKey)) return;\n    image.dataset.assetState = "ready";\n  };',
              1
          )

          required = [
              '"blue-scholar": Object.freeze({ columns: 5, rows: 6 })',
              'renderGridSpritePreview(image, item.visualKey)',
              'renderGridSpritePreview(image, visualKey)',
              'Math.round(column * width / columns)',
              'grid-first-frame'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'patch incomplete: {missing}')

          path.write_text(text, encoding='utf-8')

          html_path = Path('shop.html')
          html = html_path.read_text(encoding='utf-8')
          html = html.replace('data-ui-version="20260814-celadon-tool4"', 'data-ui-version="20260815-blue-scholar-shop-gridfix1"')
          html = html.replace(
              'assets/js/shop-navigation.js?v=20260814-outfit-shop3',
              'assets/js/shop-navigation.js?v=20260815-blue-scholar-shop-gridfix1'
          )
          if 'shop-navigation.js?v=20260815-blue-scholar-shop-gridfix1' not in html:
              raise SystemExit('shop cache-bust patch missing')
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Validate shop preview repair
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/shop-navigation.js
          grep -q 'blue-scholar.*columns: 5, rows: 6' assets/js/shop-navigation.js
          grep -q 'Math.round(column \* width / columns)' assets/js/shop-navigation.js
          grep -q 'grid-first-frame' assets/js/shop-navigation.js
          grep -q '20260815-blue-scholar-shop-gridfix1' shop.html
          git diff --check

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-blue-scholar-shop-preview.yml
          git add assets/js/shop-navigation.js shop.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: slice blue scholar shop preview from 5x6 grid'
          git pull --rebase origin main
          git push origin HEAD:main
