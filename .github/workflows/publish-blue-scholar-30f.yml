name: Publish blue scholar 30f sprite

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-blue-scholar-30f.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download candidate sprite
        shell: bash
        run: |
          set -euo pipefail
          URL='https://drive.usercontent.google.com/download?id=1vD5KsDikyXt6pX1rORotDzfx3z6zrLzs&export=download&confirm=t'
          curl -L --fail --retry 2 --connect-timeout 20 -o /tmp/blue-scholar-30f.png "$URL"
          ls -lh /tmp/blue-scholar-30f.png
          file /tmp/blue-scholar-30f.png
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/blue-scholar-30f.png')
          b=p.read_bytes()
          print('bytes',len(b),'sig',b[:8])
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          PY
