name: Validate source-locked gameplay jars

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-source-locked-jar-layers.py"
      - "assets/그림/공용/원본/장독대/**"
      - "assets/그림/게임-장면/장독대/**"
      - "assets/그림/게임-장면/manifest.json"
      - "tests/jar-source-frame-regression.test.mjs"
      - ".github/workflows/build-source-locked-jar-layers.yml"
  pull_request:
    paths:
      - "scripts/build-source-locked-jar-layers.py"
      - "assets/그림/공용/원본/장독대/**"
      - "assets/그림/게임-장면/장독대/**"
      - "assets/그림/게임-장면/manifest.json"
      - "tests/jar-source-frame-regression.test.mjs"
      - ".github/workflows/build-source-locked-jar-layers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Rebuild from canonical Korean source PNGs
        run: python scripts/build-source-locked-jar-layers.py
      - name: Validate committed outputs are reproducible
        run: |
          set -euo pipefail
          node --test tests/jar-source-frame-regression.test.mjs
          git diff --check
          git diff --exit-code -- assets/그림/게임-장면/manifest.json assets/그림/게임-장면/장독대
