name: Export celadon reference

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-celadon-reference.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect reference
        run: |
          file assets/그림/콩상점/상품/장독대/청자/뚜껑-열림.png
          sha256sum assets/그림/콩상점/상품/장독대/청자/뚜껑-열림.png
          stat -c 'size_bytes=%s' assets/그림/콩상점/상품/장독대/청자/뚜껑-열림.png
      - name: Upload reference
        uses: actions/upload-artifact@v4
        with:
          name: celadon-reference
          path: assets/그림/콩상점/상품/장독대/청자/뚜껑-열림.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
