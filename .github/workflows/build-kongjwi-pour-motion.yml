name: Validate Kongjwi motion assets

on:
  push:
    branches: [main]
    paths:
      - "assets/그림/공용/원본/콩쥐/**"
      - "assets/그림/공용/원본/바가지/**"
      - "assets/그림/공용/콩쥐/**"
      - "assets/그림/개발자료/궁중복-소환/**"
      - "assets/그림/개발자료/궁중복-하인/**"
      - "assets/그림/게임-장면/콩쥐/**"
      - "assets/그림/게임-장면/바가지/**"
      - "assets/그림/게임-장면/효과/궁중복-하인/**"
      - "assets/그림/게임-장면/manifest.json"
      - "tests/kongjwi-pour-motion.test.mjs"
      - ".github/workflows/build-kongjwi-pour-motion.yml"
  pull_request:
    paths:
      - "assets/그림/공용/원본/콩쥐/**"
      - "assets/그림/공용/원본/바가지/**"
      - "assets/그림/공용/콩쥐/**"
      - "assets/그림/개발자료/궁중복-소환/**"
      - "assets/그림/개발자료/궁중복-하인/**"
      - "assets/그림/게임-장면/콩쥐/**"
      - "assets/그림/게임-장면/바가지/**"
      - "assets/그림/게임-장면/효과/궁중복-하인/**"
      - "assets/그림/게임-장면/manifest.json"
      - "tests/kongjwi-pour-motion.test.mjs"
      - ".github/workflows/build-kongjwi-pour-motion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate current canonical motion contracts
        run: |
          set -euo pipefail
          node --test tests/kongjwi-pour-motion.test.mjs
          node scripts/validate-layered-scene.mjs
          git diff --check
