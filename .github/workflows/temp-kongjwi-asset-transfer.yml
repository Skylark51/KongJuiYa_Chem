name: Temporary Kongjwi Asset Transfer

on:
  push:
    paths:
      - '.github/workflows/temp-kongjwi-asset-transfer.yml'

permissions:
  contents: write

concurrency:
  group: temp-kongjwi-asset-transfer
  cancel-in-progress: false

jobs:
  replace-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase on latest main
        run: |
          git pull --rebase origin main

      - name: Guard target assets
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "Target changed concurrently: $path"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 20
            fi
          }
          check_blob 'assets/art/game-scene/kongjwi/classic-red/pour-sheet.png' '5e5f28fa05799abb92be72d1e9004deaf4209b7e'
          check_blob 'assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png' 'c05e8a35b45e7cc97bfdc37a2be7ffc62433085d'
          check_blob 'assets/art/game-scene/kongjwi/field-work/pour-sheet.png' 'b10701a02bae248d4cba94680b60e17bbe64203b'

      - name: Download transparent source PNGs
        shell: bash
        env:
          RED_URL: 'https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-3270-8206-8375-b0627845bc71/raw?se=2026-08-14T01%3A54%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=019ffdd8-05f3-79ad-8edd-b2c0a943f986&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-13T19%3A41%3A28Z&ske=2026-08-14T19%3A41%3A28Z&sks=b&skv=2026-02-06&sig=E9r/fMwtcAP8hzqIVfJHGuBh/s2UuvHUTuYhlmEPB3s%3D'
          BLUE_URL: 'https://oaisdmntprseasia.blob.core.windows.net/files/00000000-e970-8207-a1b5-600d434a8eda/raw?se=2026-08-14T01%3A54%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=019ffdd8-05f3-79ad-8edd-b2c0a943f986&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T01%3A37%3A10Z&ske=2026-08-15T01%3A37%3A10Z&sks=b&skv=2026-02-06&sig=e59MPnEzwSGgtR32sew78m62X309I27ZhPXPYDKEhGQ%3D'
          FIELD_URL: 'https://oaisdmntprjapaneast.blob.core.windows.net/files/00000000-01b8-8209-a69e-a451d3a8d66b/raw?se=2026-08-14T01%3A54%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=019ffdd8-05f3-79ad-8edd-b2c0a943f986&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T01%3A02%3A53Z&ske=2026-08-15T01%3A02%3A53Z&sks=b&skv=2026-02-06&sig=DfDxdlhC5krXkapWXpcQvEKEQs5krygddSR%2B100v7xE%3D'
        run: |
          set -euo pipefail
          mkdir -p /tmp/kongjwi-assets
          curl -L --fail --retry 3 --retry-delay 2 "$RED_URL" -o /tmp/kongjwi-assets/classic-red.png
          curl -L --fail --retry 3 --retry-delay 2 "$BLUE_URL" -o /tmp/kongjwi-assets/blue-scholar.png
          curl -L --fail --retry 3 --retry-delay 2 "$FIELD_URL" -o /tmp/kongjwi-assets/field-work.png

      - name: Validate PNG contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files = [
              Path('/tmp/kongjwi-assets/classic-red.png'),
              Path('/tmp/kongjwi-assets/blue-scholar.png'),
              Path('/tmp/kongjwi-assets/field-work.png'),
          ]
          for path in files:
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'not PNG: {path}')
              if data[12:16] != b'IHDR':
                  raise SystemExit(f'missing IHDR: {path}')
              width, height, bit_depth, color_type = struct.unpack('>IIBB', data[16:26])
              if (width, height) != (4096, 768):
                  raise SystemExit(f'wrong size {width}x{height}: {path}')
              if bit_depth != 8 or color_type != 6:
                  raise SystemExit(f'not RGBA8 (depth={bit_depth}, type={color_type}): {path}')
              if len(data) < 2_000_000:
                  raise SystemExit(f'suspiciously small PNG ({len(data)} bytes): {path}')
              print(f'OK {path.name}: {width}x{height}, RGBA8, {len(data)} bytes')
          PY

      - name: Replace sheets and commit
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/kongjwi-assets/classic-red.png 'assets/art/game-scene/kongjwi/classic-red/pour-sheet.png'
          cp /tmp/kongjwi-assets/blue-scholar.png 'assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png'
          cp /tmp/kongjwi-assets/field-work.png 'assets/art/game-scene/kongjwi/field-work/pour-sheet.png'
          git rm --ignore-unmatch '.github/workflows/temp-kongjwi-asset-transfer.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'assets/art/game-scene/kongjwi/classic-red/pour-sheet.png' \
            'assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png' \
            'assets/art/game-scene/kongjwi/field-work/pour-sheet.png'
          git diff --cached --stat
          git commit -m 'fix: replace Kongjwi outfit sheets with transparent frames'
          git push origin HEAD:main
