name: Temporary Apply Kongjwi Runtime Assets

on:
  push:
    paths:
      - '.github/workflows/temp-apply-kongjwi-runtime.yml'

permissions:
  contents: write

concurrency:
  group: temp-apply-kongjwi-runtime
  cancel-in-progress: false

jobs:
  apply-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase on latest main
        run: git pull --rebase origin main

      - name: Guard runtime and asset inputs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "Concurrent change detected: $path"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 20
            fi
          }
          check_blob 'assets/art/game-scene/manifest.json' '3d455850cd2459b26daea4ed39d446f8e5eec2c3'
          check_blob 'assets/js/scene-renderer.js' '9a6112b14b8dd02aab135d29726a9e37424ad469'
          check_blob '콩쥐야_줘때써.html' '730d1187755409064a49162ac65b90ff1b0d7b3a'
          check_blob 'assets/art/game-scene/kongjwi/classic-red/pour-sheet.png' 'f50514fc558b7f8d9b00120aa91c891f7df00e47'
          check_blob 'assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png' '47620fb15691cd64035181c4a89c1df4b5891010'
          check_blob 'assets/art/game-scene/kongjwi/field-work/pour-sheet.png' 'b3473fe9cf7316dd406809e88e93a564d5a9e6f9'

      - name: Bump runtime asset revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          revision = '20260814-kongjwi-outfits1'

          manifest = Path('assets/art/game-scene/manifest.json')
          text = manifest.read_text(encoding='utf-8')
          old = '"version": "20260812-night-court-summon1"'
          new = f'"version": "{revision}"'
          if text.count(old) != 1:
              raise SystemExit(f'manifest version marker count={text.count(old)}')
          manifest.write_text(text.replace(old, new), encoding='utf-8')

          renderer = Path('assets/js/scene-renderer.js')
          text = renderer.read_text(encoding='utf-8')
          replacements = {
              'manifest.json?v=20260808-motion-polish1': f'manifest.json?v={revision}',
              'game-asset-animation.css?v=20260808-motion-polish1': f'game-asset-animation.css?v={revision}',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'renderer marker count for {old}: {text.count(old)}')
              text = text.replace(old, new)
          renderer.write_text(text, encoding='utf-8')

          html = Path('콩쥐야_줘때써.html')
          text = html.read_text(encoding='utf-8')
          replacements = {
              'data-ui-version="20260813-desktop-scene1"': f'data-ui-version="{revision}"',
              'assets/css/game-asset-animation.css?v=20260808-motion-polish1': f'assets/css/game-asset-animation.css?v={revision}',
              'assets/js/game-page.js?v=20260812-rhythm-cadence2': f'assets/js/game-page.js?v={revision}',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'html marker count for {old}: {text.count(old)}')
              text = text.replace(old, new)
          html.write_text(text, encoding='utf-8')
          PY

      - name: Validate actual game asset resolution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          revision = '20260814-kongjwi-outfits1'
          manifest = json.loads(Path('assets/art/game-scene/manifest.json').read_text(encoding='utf-8'))
          if manifest.get('version') != revision:
              raise SystemExit('manifest revision did not update')

          expected = {
              'classic-red': 'assets/art/game-scene/kongjwi/classic-red/pour-sheet.png',
              'blue-scholar': 'assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png',
              'field-work': 'assets/art/game-scene/kongjwi/field-work/pour-sheet.png',
          }
          for key, path in expected.items():
              actual = manifest['assets']['kongjwi'][key]['sheet']
              if actual != path:
                  raise SystemExit(f'{key} points to {actual}, expected {path}')
              if manifest.get('availability', {}).get(path) is not True:
                  raise SystemExit(f'{key} is not authored/available in manifest')
              data = Path(path).read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n' or data[12:16] != b'IHDR':
                  raise SystemExit(f'bad PNG: {path}')
              width, height, bit_depth, color_type = struct.unpack('>IIBB', data[16:26])
              if (width, height, bit_depth, color_type) != (4096, 768, 8, 6):
                  raise SystemExit(f'bad PNG contract for {key}: {width}x{height}, depth={bit_depth}, type={color_type}')
              print(f'OK {key}: {path} -> ?scene={revision}')

          renderer = Path('assets/js/scene-renderer.js').read_text(encoding='utf-8')
          required = [
              'classic: "classic-red"',
              'scholar: "blue-scholar"',
              '"field-green": "field-work"',
              f'manifest.json?v={revision}',
          ]
          for marker in required:
              if marker not in renderer:
                  raise SystemExit(f'missing renderer marker: {marker}')

          html = Path('콩쥐야_줘때써.html').read_text(encoding='utf-8')
          for marker in [
              f'data-ui-version="{revision}"',
              f'game-asset-animation.css?v={revision}',
              f'game-page.js?v={revision}',
          ]:
              if marker not in html:
                  raise SystemExit(f'missing game entry cache marker: {marker}')
          PY
          node --check assets/js/scene-renderer.js
          node --check assets/js/game-page.js
          node --check assets/js/ui-effects.js
          node --check assets/js/game-cosmetics-entry.js
          node --check assets/js/cosmetic-system.js

      - name: Commit and push runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git rm '.github/workflows/temp-apply-kongjwi-runtime.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'assets/art/game-scene/manifest.json' \
            'assets/js/scene-renderer.js' \
            '콩쥐야_줘때써.html'
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: apply refreshed Kongjwi outfits in game runtime'
          git push origin HEAD:main
