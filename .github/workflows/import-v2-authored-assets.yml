name: Import V2 authored PNG assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-v2-authored-assets.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download full-resolution authored PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/art/game-scene-v2/kongjwi/underlayer
          mkdir -p assets/art/game-scene-v2/kongjwi/night-court
          mkdir -p assets/art/game-scene-v2/servants
          mkdir -p assets/art/game-scene-v2/jars/celadon

          curl -fL --retry 3 'https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-f500-8206-9253-bb847d26901a/raw?se=2026-08-12T08%3A00%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=019ff4f5-e224-7959-8ec7-3c916df85ea5&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T04%3A35%3A17Z&ske=2026-08-13T04%3A35%3A17Z&sks=b&skv=2026-02-06&sig=zkUk%2B22wZ9XI%2BFXuG21mZ8IATm/MNfjdmxeVTI/fTwA%3D' -o assets/art/game-scene-v2/kongjwi/underlayer/master-motion-sheet.png
          curl -fL --retry 3 'https://oaisdmntprwestcentralus.blob.core.windows.net/files/00000000-cd68-81fb-a262-c433ecf469fe/raw?se=2026-08-12T08%3A01%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=019ff4f5-e224-7959-8ec7-3c916df85ea5&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T05%3A02%3A44Z&ske=2026-08-13T05%3A02%3A44Z&sks=b&skv=2026-02-06&sig=0b6iVAUEVHelxGMBfYzgr9p9nkUIHkSsuIjrer4pewg%3D' -o assets/art/game-scene-v2/kongjwi/night-court/summon-sheet.png
          curl -fL --retry 3 'https://oaisdmntprnorthcentralus.blob.core.windows.net/files/00000000-9da4-822f-9126-48c4ec7ec89c/raw?se=2026-08-12T08%3A01%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=019ff4f5-e224-7959-8ec7-3c916df85ea5&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T04%3A43%3A43Z&ske=2026-08-13T04%3A43%3A43Z&sks=b&skv=2026-02-06&sig=6gDrc/VFpt9M99KfcBvCPWFY7m3ZIlJi7TVi4fLEhQM%3D' -o assets/art/game-scene-v2/servants/dolsoe-water-sheet.png
          curl -fL --retry 3 'https://oaisdmntprkoreacentral.blob.core.windows.net/files/00000000-e95c-8206-ba79-ade02ecc4cc2/raw?se=2026-08-12T08%3A01%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=019ff4f5-e224-7959-8ec7-3c916df85ea5&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T00%3A08%3A42Z&ske=2026-08-13T00%3A08%3A42Z&sks=b&skv=2026-02-06&sig=Hx3pEQdk1d79x7/TMsc/koNNUrEkgAWSZjX66OuPMcE%3D' -o assets/art/game-scene-v2/jars/celadon/authored-open-body.png
          curl -fL --retry 3 'https://oaisdmntpreastus2.blob.core.windows.net/files/00000000-9b7c-81f6-8665-4163d5b9f9ad/raw?se=2026-08-12T08%3A01%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=019ff4f5-e224-7959-8ec7-3c916df85ea5&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T01%3A21%3A54Z&ske=2026-08-13T01%3A21%3A54Z&sks=b&skv=2026-02-06&sig=h0lbg7XoTUvgEgbuymKEN0NgbSXwSx9RSWly3NEMf9s%3D' -o assets/art/game-scene-v2/jars/celadon/authored-open-lid.png

      - name: Verify exact PNG binaries
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/checksums.txt <<'EOF'
          6c48aaab46dd18fa77a4a6be3233e4eaf7ae1e1126d10abbdcc2fd1a3b94b95e  assets/art/game-scene-v2/kongjwi/underlayer/master-motion-sheet.png
          2538b4244562dd44823554f5762be7fa277c9579671b317ef8e5cf22638a6d13  assets/art/game-scene-v2/kongjwi/night-court/summon-sheet.png
          f73fb9d99d664ef18b258b345ebcc5a77cd940516505ce0c7753d78a6bd5782d  assets/art/game-scene-v2/servants/dolsoe-water-sheet.png
          17558babfa1e196f3abcf494e59730e8f23d17e57474b4b1b5e09c8c85158d87  assets/art/game-scene-v2/jars/celadon/authored-open-body.png
          707f13caabba61c65cb450ab327d86f3ced26a8e26e74d33a0a5952d8e24038a  assets/art/game-scene-v2/jars/celadon/authored-open-lid.png
          EOF
          sha256sum -c /tmp/checksums.txt
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              'assets/art/game-scene-v2/kongjwi/underlayer/master-motion-sheet.png',
              'assets/art/game-scene-v2/kongjwi/night-court/summon-sheet.png',
              'assets/art/game-scene-v2/servants/dolsoe-water-sheet.png',
              'assets/art/game-scene-v2/jars/celadon/authored-open-body.png',
              'assets/art/game-scene-v2/jars/celadon/authored-open-lid.png',
          ]
          for path in paths:
              data = Path(path).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', path
              assert data.rfind(b'IEND') != -1, path
              print(path, len(data))
          PY

      - name: Commit PNG binaries to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/art/game-scene-v2/kongjwi/underlayer/master-motion-sheet.png
          git add assets/art/game-scene-v2/kongjwi/night-court/summon-sheet.png
          git add assets/art/game-scene-v2/servants/dolsoe-water-sheet.png
          git add assets/art/game-scene-v2/jars/celadon/authored-open-body.png
          git add assets/art/game-scene-v2/jars/celadon/authored-open-lid.png
          git rm .github/workflows/import-v2-authored-assets.yml
          git commit -m 'feat: add first-stage authored V2 PNG assets'
          git push origin HEAD:main
