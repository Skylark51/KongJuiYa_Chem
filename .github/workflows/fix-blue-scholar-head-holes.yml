name: Fix blue scholar head holes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-blue-scholar-head-holes.yml'

permissions:
  contents: write

concurrency:
  group: fix-blue-scholar-head-holes
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image dependencies
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0 numpy==2.3.5 opencv-python-headless==4.13.0.92

      - name: Synchronize and guard inputs
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git rev-parse "HEAD:${path}")"
            if [ "$actual" != "$expected" ]; then
              echo "Concurrent change detected: $path" >&2
              echo "expected=$expected actual=$actual" >&2
              exit 42
            fi
          }
          check_blob 'assets/art/game-scene-v2/kongjwi/blue-scholar/pour-sheet.png' '47620fb15691cd64035181c4a89c1df4b5891010'
          check_blob 'assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png' '47620fb15691cd64035181c4a89c1df4b5891010'
          check_blob 'scripts/build-kongjwi-pour-sheets.py' '07e242433480500c5d8e6b4c3228893322b2e209'
          check_blob '.github/workflows/build-kongjwi-pour-motion.yml' 'a19b32f71a4c9969bde2ce9be85baebade951f76'
          check_blob 'tests/kongjwi-pour-motion.test.mjs' 'a73a011e3c4a0e4bb70cb840145604c1d51c4df2'
          check_blob 'assets/js/scene-renderer.js' '39163b0c2cefe1b3c47a111edb7015780c4935ab'
          check_blob '콩쥐야_줘때써.html' '35facc46a8d37d91f2f18a7144734eaf73c4e3ca'

      - name: Repair damaged high-resolution head pixels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import cv2
          import numpy as np
          import shutil

          CELL_W, CELL_H, FRAMES = 512, 768, 8
          source_path = Path('assets/art/game-scene-v2/kongjwi/blue-scholar/pour-sheet.png')
          runtime_path = Path('assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png')
          original = Image.open(source_path).convert('RGBA')
          if original.size != (4096, 768):
              raise SystemExit(f'unexpected blue-scholar sheet size: {original.size}')
          original_frames = [
              np.asarray(original.crop((i*CELL_W, 0, (i+1)*CELL_W, CELL_H)), dtype=np.uint8).copy()
              for i in range(FRAMES)
          ]
          frames = [frame.copy() for frame in original_frames]

          donors = {0: 5, 1: 5, 3: 6}
          matrices = {
              0: np.array([[1.02455380, 0.0132344373, -9.34106399],
                           [-0.0132344373, 1.02455380, 14.8251858]], dtype=np.float32),
              1: np.array([[1.0141254, 0.03065509, -27.06453413],
                           [-0.03065509, 1.0141254, 20.93064064]], dtype=np.float32),
              3: np.array([[1.02328386, -0.10947533, 35.66988694],
                           [0.10947533, 1.02328386, -17.11896706]], dtype=np.float32),
          }

          def warped_donor(target_index):
              donor = original_frames[donors[target_index]]
              return cv2.warpAffine(
                  donor,
                  matrices[target_index],
                  (CELL_W, CELL_H),
                  flags=cv2.INTER_LINEAR,
                  borderMode=cv2.BORDER_CONSTANT,
                  borderValue=(0, 0, 0, 0),
              ).astype(np.float32)

          def authoritative_crown(target_index, box, fade_y, preserve_bright_threshold=140):
              target = original_frames[target_index].astype(np.float32)
              donor = warped_donor(target_index)
              x0, y0, x1, y1 = box
              region = np.zeros((CELL_H, CELL_W), dtype=np.float32)
              region[y0:y1, x0:x1] = 1.0
              fy0, fy1 = fade_y
              for y in range(max(y0, fy0), min(y1, fy1)):
                  region[y, :] *= (fy1 - y) / (fy1 - fy0)
              brightness = target[:, :, :3].mean(axis=2)
              preserve = ((brightness > preserve_bright_threshold) & (target[:, :, 3] > 100)).astype(np.float32)
              weight = region * (1.0 - preserve)
              output = target * (1.0 - weight[:, :, None]) + donor * weight[:, :, None]
              return np.clip(output, 0, 255).astype(np.uint8)

          frames[0] = authoritative_crown(0, (190, 55, 345, 155), (125, 155))

          target = original_frames[1].astype(np.float32)
          donor = warped_donor(1)
          crown = authoritative_crown(1, (170, 60, 325, 155), (125, 155)).astype(np.float32)
          donor_brightness = donor[:, :, :3].mean(axis=2)
          target_brightness = target[:, :, :3].mean(axis=2)
          region = np.zeros((CELL_H, CELL_W), dtype=np.float32)
          region[100:215, 165:245] = 1.0
          hair = ((donor[:, :, 3] > 20) & (donor_brightness < 125)).astype(np.float32)
          weight = cv2.GaussianBlur(region * hair, (0, 0), 0.35)
          preserve = ((target_brightness > 145) & (target[:, :, 3] > 100)).astype(np.float32)
          weight *= (1.0 - preserve)
          repaired = crown * (1.0 - weight[:, :, None]) + donor * weight[:, :, None]
          frames[1] = np.clip(repaired, 0, 255).astype(np.uint8)

          frames[3] = authoritative_crown(3, (190, 50, 390, 150), (118, 150))

          for index in (2, 4, 5, 6, 7):
              if not np.array_equal(frames[index], original_frames[index]):
                  raise SystemExit(f'untargeted frame changed: {index}')

          checks = {0: (259, 101), 1: (228, 106), 3: (281, 102)}
          for index, (x, y) in checks.items():
              before = int(original_frames[index][y, x, 3])
              after = int(frames[index][y, x, 3])
              if before >= 50 or after < 220:
                  raise SystemExit(f'head-hole repair failed for frame {index}: alpha {before}->{after}')
              print(f'frame {index}: repaired crown alpha at ({x},{y}) {before}->{after}')

          face_box = (215, 125, 315, 215)
          for index in (0, 3):
              x0, y0, x1, y1 = face_box
              if not np.array_equal(frames[index][y0:y1, x0:x1], original_frames[index][y0:y1, x0:x1]):
                  raise SystemExit(f'face core changed in frame {index}')

          sheet = Image.new('RGBA', (CELL_W * FRAMES, CELL_H), (0, 0, 0, 0))
          for index, frame in enumerate(frames):
              sheet.alpha_composite(Image.fromarray(frame, 'RGBA'), (index * CELL_W, 0))
          sheet.save(source_path, 'PNG', optimize=True, compress_level=9)
          shutil.copyfile(source_path, runtime_path)

          audit = Image.new('RGBA', (CELL_W * 4, 260 * 2), (235, 235, 235, 255))
          for index in range(FRAMES):
              crop = Image.fromarray(frames[index], 'RGBA').crop((120, 40, 400, 300))
              cell = Image.new('RGBA', (CELL_W, 260), (235, 235, 235, 255))
              cell.alpha_composite(crop, (116, 0))
              ImageDraw.Draw(cell).text((8, 8), f'F{index}', fill=(220, 0, 0, 255))
              audit.alpha_composite(cell, ((index % 4) * CELL_W, (index // 4) * 260))
          Path('diagnostic-blue-scholar-fixed').mkdir(exist_ok=True)
          audit.save('diagnostic-blue-scholar-fixed/heads-fixed.png')
          PY

      - name: Make high-resolution sheets canonical and bump runtime revision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          revision = '20260815-blue-scholar-headsafe1'

          path = Path('scripts/build-kongjwi-pour-sheets.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import math\nfrom pathlib import Path', 'import math\nimport shutil\nfrom pathlib import Path', 1)
          marker = '''SOURCES = {\n    "underlayer": "kongjwi-underlayer-cutout.png",\n    "classic-red": "kongjwi-classic-red-cutout.png",\n    "blue-scholar": "kongjwi-blue-scholar-cutout.png",\n    "field-work": "kongjwi-field-work-cutout.png",\n    "ragged": "kongjwi-ragged-cutout.png",\n    "night-court": "kongjwi-night-court-cutout.png",\n}\n'''
          replacement = marker + '''AUTHORED_HQ_SKINS = {"classic-red", "blue-scholar", "field-work"}\nAUTHORED_HQ_ROOT = Path("assets/art/game-scene-v2/kongjwi")\n'''
          if text.count(marker) != 1:
              raise SystemExit('SOURCES marker changed')
          text = text.replace(marker, replacement, 1)

          old_build = '''def build_kongjwi(root: Path, force: bool = False):\n    ensure_night_court_head(root)\n    shared_hand_points = None\n    for skin, filename in SOURCES.items():\n        if skin == "night-court":\n            continue\n        source = load_rgba(root / "assets/art/kongjwi" / filename)\n        base = fit_source(source)\n        frames, hand_points = build_intact_frames(base)\n        if shared_hand_points is None:\n            shared_hand_points = hand_points\n\n        output = root / "assets/art/game-scene/kongjwi" / skin / "pour-sheet.png"\n        if output.exists() and not force:\n            with Image.open(output) as current:\n                if current.size != (CELL[0] * FRAMES, CELL[1]):\n                    raise RuntimeError(f"Unexpected {skin} sheet size: {current.size}")\n            continue\n        write_sheet(frames, output)\n\n    build_night_court_summon(root, force=force)\n    return shared_hand_points\n'''
          new_build = '''def build_kongjwi(root: Path, force: bool = False):\n    ensure_night_court_head(root)\n    shared_hand_points = None\n    for skin, filename in SOURCES.items():\n        if skin == "night-court":\n            continue\n\n        output = root / "assets/art/game-scene/kongjwi" / skin / "pour-sheet.png"\n        if skin in AUTHORED_HQ_SKINS:\n            canonical = root / AUTHORED_HQ_ROOT / skin / "pour-sheet.png"\n            canonical_image = load_rgba(canonical)\n            if canonical_image.size != (CELL[0] * FRAMES, CELL[1]):\n                raise RuntimeError(f"Unexpected authored HQ {skin} sheet size: {canonical_image.size}")\n            output.parent.mkdir(parents=True, exist_ok=True)\n            if not output.exists() or output.read_bytes() != canonical.read_bytes():\n                shutil.copyfile(canonical, output)\n                print(f"{skin}: synchronized authored HQ canonical sheet")\n            continue\n\n        source = load_rgba(root / "assets/art/kongjwi" / filename)\n        base = fit_source(source)\n        frames, hand_points = build_intact_frames(base)\n        if shared_hand_points is None:\n            shared_hand_points = hand_points\n\n        if output.exists() and not force:\n            with Image.open(output) as current:\n                if current.size != (CELL[0] * FRAMES, CELL[1]):\n                    raise RuntimeError(f"Unexpected {skin} sheet size: {current.size}")\n            continue\n        write_sheet(frames, output)\n\n    build_night_court_summon(root, force=force)\n    return shared_hand_points\n'''
          if text.count(old_build) != 1:
              raise SystemExit('build_kongjwi block changed')
          text = text.replace(old_build, new_build, 1)
          text = text.replace('manifest["version"] = "20260812-night-court-summon1"', f'manifest["version"] = "{revision}"', 1)
          text = text.replace('Built intact standard outfits + anchored night-court summon + four canonical-master bucket sheets', 'Built authored HQ + source-locked standard outfits + anchored night-court summon + four canonical-master bucket sheets', 1)
          path.write_text(text, encoding='utf-8')

          path = Path('.github/workflows/build-kongjwi-pour-motion.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('skins = ("underlayer", "classic-red", "blue-scholar", "field-work", "ragged")', 'generated_skins = ("underlayer", "ragged")\n          hq_skins = ("classic-red", "blue-scholar", "field-work")', 1)
          text = text.replace('assert manifest["version"] == "20260812-night-court-summon1"', f'assert manifest["version"] == "{revision}"', 1)
          text = text.replace('          for skin in skins:\n', '          for skin in generated_skins:\n', 1)
          anchor = '''              assert np.count_nonzero(np.any(np.abs(idle - wrong) > 12, axis=2)) > 300, skin\n\n          night_path = Path("assets/art/game-scene/kongjwi/night-court/pour-sheet.png")\n'''
          inserted = '''              assert np.count_nonzero(np.any(np.abs(idle - wrong) > 12, axis=2)) > 300, skin\n\n          for skin in hq_skins:\n              active_path = Path("assets/art/game-scene/kongjwi") / skin / "pour-sheet.png"\n              canonical_path = Path("assets/art/game-scene-v2/kongjwi") / skin / "pour-sheet.png"\n              assert active_path.read_bytes() == canonical_path.read_bytes(), f"{skin}: runtime diverged from authored HQ canonical sheet"\n              image = Image.open(active_path).convert("RGBA")\n              assert image.size == (4096, 768), (skin, image.size)\n\n          blue = Image.open(Path("assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png")).convert("RGBA")\n          for frame, point in {0: (259, 101), 1: (228, 106), 3: (281, 102)}.items():\n              x, y = point\n              assert blue.getpixel((frame * 512 + x, y))[3] >= 220, f"blue-scholar frame {frame}: crown hole regressed"\n\n          night_path = Path("assets/art/game-scene/kongjwi/night-court/pour-sheet.png")\n'''
          if text.count(anchor) != 1:
              raise SystemExit('workflow validation insertion anchor changed')
          text = text.replace(anchor, inserted, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/kongjwi-pour-motion.test.mjs')
          text = path.read_text(encoding='utf-8')
          old_versions = '["20260808-anatomy-safe1", "20260808-head-safe1", "20260808-head-safe2", "20260808-layer-safe1", "20260812-night-court-summon1"]'
          new_versions = '["20260808-anatomy-safe1", "20260808-head-safe1", "20260808-head-safe2", "20260808-layer-safe1", "20260812-night-court-summon1", "20260815-blue-scholar-headsafe1"]'
          if text.count(old_versions) != 1:
              raise SystemExit('test version list changed')
          text = text.replace(old_versions, new_versions, 1)
          builder_anchor = '  assert.ok(builder.includes("def build_intact_frames"));\n'
          builder_insert = '  assert.ok(builder.includes("AUTHORED_HQ_SKINS"));\n  assert.ok(builder.includes("shutil.copyfile(canonical, output)"));\n' + builder_anchor
          if text.count(builder_anchor) != 1:
              raise SystemExit('builder test anchor changed')
          text = text.replace(builder_anchor, builder_insert, 1)
          path.write_text(text, encoding='utf-8')

          manifest_path = Path('assets/art/game-scene/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = revision
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for filename in ('assets/js/scene-renderer.js', '콩쥐야_줘때써.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              count = text.count('20260814-kongjwi-outfits1')
              if count < 1:
                  raise SystemExit(f'old runtime revision missing in {filename}')
              path.write_text(text.replace('20260814-kongjwi-outfits1', revision), encoding='utf-8')
          PY

      - name: Validate repaired runtime and regression guards
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-kongjwi-pour-sheets.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          revision = '20260815-blue-scholar-headsafe1'
          active = Path('assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png')
          canonical = Path('assets/art/game-scene-v2/kongjwi/blue-scholar/pour-sheet.png')
          assert active.read_bytes() == canonical.read_bytes()
          image = Image.open(active).convert('RGBA')
          assert image.size == (4096, 768)
          for frame, (x, y) in {0: (259,101), 1: (228,106), 3: (281,102)}.items():
              assert image.getpixel((frame*512+x, y))[3] >= 220, frame
          manifest = json.loads(Path('assets/art/game-scene/manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == revision
          renderer = Path('assets/js/scene-renderer.js').read_text(encoding='utf-8')
          html = Path('콩쥐야_줘때써.html').read_text(encoding='utf-8')
          assert f'manifest.json?v={revision}' in renderer
          assert revision in html
          PY
          node --test tests/kongjwi-pour-motion.test.mjs tests/kongjwi-underlayer-grip.test.mjs
          node --check assets/js/scene-renderer.js
          node --check assets/js/game-page.js
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: blue-scholar-head-fixed-audit
          path: diagnostic-blue-scholar-fixed/
          if-no-files-found: error

      - name: Commit repaired assets and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch '.github/workflows/diagnose-blue-scholar-heads.yml'
          git rm --ignore-unmatch '.github/workflows/fix-blue-scholar-head-holes.yml'
          git add \
            'assets/art/game-scene-v2/kongjwi/blue-scholar/pour-sheet.png' \
            'assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png' \
            'assets/art/game-scene/manifest.json' \
            'assets/js/scene-renderer.js' \
            '콩쥐야_줘때써.html' \
            'scripts/build-kongjwi-pour-sheets.py' \
            '.github/workflows/build-kongjwi-pour-motion.yml' \
            'tests/kongjwi-pour-motion.test.mjs'
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: repair blue scholar head-safe pour frames'
          git pull --rebase origin main
          git push origin HEAD:main
