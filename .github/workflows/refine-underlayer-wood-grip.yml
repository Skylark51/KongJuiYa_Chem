name: Refine underlayer wood grip

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refine-underlayer-wood-grip.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize and guard target
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          target="assets/art/game-scene-v2/kongjwi/underlayer/wood-grip-sheet.png"
          expected="812722cc74595762f2d4186782f3bb951ce43ea0"
          actual="$(git rev-parse "HEAD:${target}")"
          if [ "$actual" != "$expected" ]; then
            echo "Target changed concurrently: expected $expected, got $actual" >&2
            exit 42
          fi

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check "Pillow==12.3.0"

      - name: Rebuild grip sheet from existing source pixels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw, ImageChops
          import math
          from pathlib import Path

          target = Path("assets/art/game-scene-v2/kongjwi/underlayer/wood-grip-sheet.png")
          body_path = Path("assets/art/game-scene-v2/kongjwi/underlayer/pour-sheet.png")
          tool_path = Path("assets/art/game-scene-v2/tools/wood/master.png")

          body = Image.open(body_path).convert("RGBA")
          toolp = ImageOps.mirror(Image.open(tool_path).convert("RGBA"))
          toolp = toolp.resize(
              (round(toolp.width * 0.84), round(toolp.height * 0.84)),
              Image.Resampling.LANCZOS,
          )

          if body.size != (4096, 768):
              raise SystemExit(f"Unexpected source sheet size: {body.size}")

          BODY_POSES = (
              (0.0, 0, 0),
              (0.0, 0, -1),
              (-0.2, 0, -1),
              (-0.45, 1, -2),
              (-0.75, 2, -3),
              (-1.05, 3, -3),
              (-0.4, 1, -1),
              (0.8, -2, 4),
          )
          BODY_PIVOT = (256, 710)
          ARM_ANGLES = (8, 10, 14, 18, 22, 25, 15, 5)
          TOOL_ANGLES = (0, 2, 6, 10, 16, 22, 8, -5)

          def rotpt(p, pivot, deg):
              rad = math.radians(deg)
              dx = p[0] - pivot[0]
              dy = p[1] - pivot[1]
              return (
                  pivot[0] + math.cos(rad) * dx + math.sin(rad) * dy,
                  pivot[1] - math.sin(rad) * dx + math.cos(rad) * dy,
              )

          def posept(p, pose):
              x, y = rotpt(p, BODY_PIVOT, pose[0])
              return x + pose[1], y + pose[2]

          def polygon_mask(size, points, fade_top=None):
              mask = Image.new("L", size, 0)
              ImageDraw.Draw(mask).polygon(points, fill=255)
              if fade_top:
                  y0, y1 = fade_top
                  grad = Image.new("L", size, 255)
                  draw = ImageDraw.Draw(grad)
                  draw.rectangle((0, 0, size[0], math.floor(y0)), fill=0)
                  for y in range(
                      max(0, math.floor(y0) + 1),
                      min(size[1], math.ceil(y1) + 1),
                  ):
                      value = int(round(255 * max(0, min(1, (y - y0) / (y1 - y0)))))
                      draw.line((0, y, size[0], y), fill=value)
                  mask = ImageChops.multiply(mask, grad)
              return mask

          def place_tool(tool, hand, degrees, grip=(34, 19)):
              size = 300
              pivot = (150, 150)
              local = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              local.alpha_composite(tool, (pivot[0] - grip[0], pivot[1] - grip[1]))
              local = local.rotate(
                  degrees,
                  resample=Image.Resampling.BICUBIC,
                  expand=False,
                  center=pivot,
              )
              out = Image.new("RGBA", (512, 768), (0, 0, 0, 0))
              out.alpha_composite(
                  local,
                  (round(hand[0] - pivot[0]), round(hand[1] - pivot[1])),
              )
              return out

          def build_frame(base_frame, index):
              elbow = posept((306, 272), BODY_POSES[index])
              hand0 = posept((335, 389), BODY_POSES[index])
              offset = (elbow[0] - 306, elbow[1] - 272)

              srcpoly = [
                  (302, 263), (318, 263), (319, 293), (324, 320),
                  (330, 344), (340, 366), (346, 383), (341, 400),
                  (326, 400), (318, 380), (313, 354), (309, 328),
                  (305, 303), (302, 281),
              ]
              srcpoly = [
                  (round(x + offset[0]), round(y + offset[1])) for x, y in srcpoly
              ]
              arm_mask = polygon_mask(
                  base_frame.size,
                  srcpoly,
                  (263 + offset[1], 275 + offset[1]),
              )
              arm = base_frame.copy()
              arm.putalpha(ImageChops.multiply(base_frame.getchannel("A"), arm_mask))

              erasepoly = [
                  (300, 262), (320, 262), (321, 295), (326, 322),
                  (332, 346), (342, 367), (348, 384), (343, 402),
                  (324, 402), (316, 381), (311, 355), (307, 329),
                  (303, 304), (300, 281),
              ]
              erasepoly = [
                  (round(x + offset[0]), round(y + offset[1])) for x, y in erasepoly
              ]
              erase_mask = polygon_mask(
                  base_frame.size,
                  erasepoly,
                  (262 + offset[1], 274 + offset[1]),
              )
              base = base_frame.copy()
              base.putalpha(
                  ImageChops.multiply(
                      base_frame.getchannel("A"),
                      ImageOps.invert(erase_mask),
                  )
              )

              arm_rotated = arm.rotate(
                  ARM_ANGLES[index],
                  resample=Image.Resampling.BICUBIC,
                  expand=False,
                  center=elbow,
              )
              hand = rotpt(hand0, elbow, ARM_ANGLES[index])
              bucket = place_tool(toolp, hand, TOOL_ANGLES[index])

              # Bucket first, then original hand/forearm pixels: the handle passes
              # behind the palm instead of floating beside it.
              base.alpha_composite(bucket)
              base.alpha_composite(arm_rotated)
              return base

          sheet = Image.new("RGBA", (4096, 768), (0, 0, 0, 0))
          for i in range(8):
              frame = body.crop((i * 512, 0, (i + 1) * 512, 768))
              sheet.alpha_composite(build_frame(frame, i), (i * 512, 0))

          sheet.save(target, "PNG", optimize=True, compress_level=9)

          check = Image.open(target)
          if check.format != "PNG" or check.mode != "RGBA" or check.size != (4096, 768):
              raise SystemExit(
                  f"Invalid output: format={check.format}, mode={check.mode}, size={check.size}"
              )

          for i in range(8):
              frame = check.crop((i * 512, 0, (i + 1) * 512, 768))
              bbox = frame.getchannel("A").getbbox()
              if not bbox:
                  raise SystemExit(f"Frame {i} is empty")
              if bbox[0] <= 0 or bbox[1] <= 0 or bbox[2] >= 512 or bbox[3] >= 768:
                  raise SystemExit(f"Frame {i} clips cell boundary: {bbox}")
              print(f"frame {i}: alpha bbox={bbox}")

          print(f"output={target} size={target.stat().st_size} bytes")
          PY

      - name: Commit target and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          target="assets/art/game-scene-v2/kongjwi/underlayer/wood-grip-sheet.png"
          workflow=".github/workflows/refine-underlayer-wood-grip.yml"

          git rm "$workflow"
          git add "$target"
          git diff --cached --stat
          git commit -m "fix: redraw underlayer wood grip poses [skip ci]"

          # Rebase once more immediately before publishing. Any concurrent edit to
          # the target will produce a conflict and stop the job rather than overwrite it.
          git pull --rebase origin main
          git push origin HEAD:main
