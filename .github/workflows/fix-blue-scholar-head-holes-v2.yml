name: Fix blue scholar head holes v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-blue-scholar-head-holes-v2.yml'

permissions:
  contents: write

concurrency:
  group: fix-blue-scholar-head-holes-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image dependencies
        run: python -m pip install --disable-pip-version-check Pillow==12.3.0 numpy==2.3.5 opencv-python-headless==4.13.0.92
      - name: Synchronize before repair
        run: git pull --rebase origin main
      - name: Repair head pixels and patch permanent guards
        run: python scripts/tmp-fix-blue-scholar-head-holes.py
      - name: Validate asset identity and code regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-kongjwi-pour-sheets.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json

          revision = '20260815-blue-scholar-headsafe1'
          active = Path('assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png')
          canonical = Path('assets/art/game-scene-v2/kongjwi/blue-scholar/pour-sheet.png')
          assert active.read_bytes() == canonical.read_bytes(), 'runtime/v2 blue-scholar mismatch'
          image = Image.open(active).convert('RGBA')
          assert image.size == (4096, 768)
          for frame, (x, y) in {0: (259,101), 1: (228,106), 3: (281,102)}.items():
              alpha = image.getpixel((frame*512+x, y))[3]
              assert alpha >= 220, (frame, alpha)
              print(f'frame {frame}: crown alpha={alpha}')
          manifest = json.loads(Path('assets/art/game-scene/manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == revision
          assert f'manifest.json?v={revision}' in Path('assets/js/scene-renderer.js').read_text(encoding='utf-8')
          assert revision in Path('콩쥐야_줘때써.html').read_text(encoding='utf-8')
          PY
          node --test tests/kongjwi-pour-motion.test.mjs tests/kongjwi-underlayer-grip.test.mjs
          node --check assets/js/scene-renderer.js
          node --check assets/js/game-page.js
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: blue-scholar-head-fixed-audit
          path: diagnostic-blue-scholar-fixed/
          if-no-files-found: error
      - name: Commit repaired assets and permanent guards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch '.github/workflows/diagnose-blue-scholar-heads.yml'
          git rm --ignore-unmatch '.github/workflows/fix-blue-scholar-head-holes.yml'
          git rm --ignore-unmatch '.github/workflows/fix-blue-scholar-head-holes-v2.yml'
          git rm --ignore-unmatch 'scripts/tmp-fix-blue-scholar-head-holes.py'
          git add \
            'assets/art/game-scene-v2/kongjwi/blue-scholar/pour-sheet.png' \
            'assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png' \
            'assets/art/game-scene/manifest.json' \
            'assets/js/scene-renderer.js' \
            '콩쥐야_줘때써.html' \
            'scripts/build-kongjwi-pour-sheets.py' \
            '.github/workflows/build-kongjwi-pour-motion.yml' \
            'tests/kongjwi-pour-motion.test.mjs'
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: repair blue scholar head-safe pour frames'
          git pull --rebase origin main
          git push origin HEAD:main
