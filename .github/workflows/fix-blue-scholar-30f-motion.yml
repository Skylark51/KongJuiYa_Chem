name: Fix blue scholar 30-frame motion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-blue-scholar-30f-motion.yml'

permissions:
  contents: write

concurrency:
  group: fix-blue-scholar-30f-motion
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install image normalization dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy opencv-python-headless

      - name: Normalize current blue-scholar art and repair runtime contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil

          import cv2
          import numpy as np
          from PIL import Image
          from scipy.ndimage import distance_transform_edt

          ROOT = Path('.')
          CANONICAL = ROOT / 'assets/art/game-scene-v2/kongjwi/blue-scholar/pour-sheet.png'
          RUNTIME = ROOT / 'assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png'
          PREVIEW = ROOT / 'assets/art/game-scene-v2/kongjwi/blue-scholar/preview.png'
          PROVENANCE = ROOT / 'assets/art/game-scene-v2/kongjwi/blue-scholar/normalization.json'
          SOURCE_EXPECTED = (1024, 1536)
          CELL = (256, 384)
          GRID = (5, 6)
          TARGET_FOOT = (128, 350)
          TARGET_BODY_HEIGHT = 260
          CORE_ALPHA = 96
          MIN_CORE_AREA = 10000

          source_bytes = CANONICAL.read_bytes()
          source_sha = hashlib.sha256(source_bytes).hexdigest()
          source = Image.open(CANONICAL).convert('RGBA')
          if source.size != SOURCE_EXPECTED:
              raise SystemExit(f'expected packed current-design source {SOURCE_EXPECTED}, got {source.size}')

          rgba = np.array(source)
          alpha = rgba[:, :, 3]
          core = (alpha > CORE_ALPHA).astype(np.uint8)
          count, labels, stats, centroids = cv2.connectedComponentsWithStats(core, 8)
          components = []
          for label in range(1, count):
              x, y, w, h, area = stats[label]
              if int(area) >= MIN_CORE_AREA:
                  components.append((label, int(x), int(y), int(w), int(h), int(area), centroids[label]))
          if len(components) != 30:
              raise SystemExit(f'blue-scholar packed source must expose exactly 30 character cores, found {len(components)}')

          # The authored image is visually a 5x6 reading-order sheet, but the figures
          # overlap the nominal cell boundaries. Recover the 30 actual figures first,
          # then place each one into a real fixed cell. Nothing is redrawn.
          by_y = sorted(components, key=lambda item: float(item[6][1]))
          ordered = []
          for row in range(GRID[1]):
              ordered.extend(sorted(by_y[row * GRID[0]:(row + 1) * GRID[0]], key=lambda item: float(item[6][0])))

          seeds = np.zeros_like(labels, dtype=np.int16)
          for index, component in enumerate(ordered, 1):
              seeds[labels == component[0]] = index
          _, nearest_indices = distance_transform_edt(seeds == 0, return_indices=True)
          nearest = seeds[nearest_indices[0], nearest_indices[1]]

          extracted = []
          metrics = []
          for index, component in enumerate(ordered, 1):
              visible = (nearest == index) & (alpha > 0)
              ys, xs = np.where(visible)
              if not len(xs):
                  raise SystemExit(f'frame {index - 1} became empty during separation')
              x0, y0, x1, y1 = int(xs.min()), int(ys.min()), int(xs.max() + 1), int(ys.max() + 1)
              crop = rgba[y0:y1, x0:x1].copy()
              local = visible[y0:y1, x0:x1]
              crop[:, :, 3] = np.where(local, crop[:, :, 3], 0)

              label = component[0]
              core_ys, core_xs = np.where(labels == label)
              bottom = int(core_ys.max() + 1)
              foot_band = core_ys >= core_ys.max() - 20
              foot_x = float(np.median(core_xs[foot_band]))
              central = (core_xs >= foot_x - 40) & (core_xs <= foot_x + 40)
              body_ys = core_ys[central]
              body_height = int(body_ys.max() + 1 - body_ys.min())

              local_foot_x = foot_x - x0
              local_foot_y = bottom - y0
              left = x0 - foot_x
              right = x1 - foot_x
              top = y0 - bottom
              below = y1 - bottom

              target_scale = TARGET_BODY_HEIGHT / max(1, body_height)
              fit_x_left = (TARGET_FOOT[0] - 4) / (-left) if left < 0 else 99.0
              fit_x_right = (CELL[0] - 4 - TARGET_FOOT[0]) / right if right > 0 else 99.0
              fit_y_top = (TARGET_FOOT[1] - 8) / (-top) if top < 0 else 99.0
              fit_y_bottom = (CELL[1] - 4 - TARGET_FOOT[1]) / below if below > 0 else 99.0
              scale = min(target_scale, fit_x_left, fit_x_right, fit_y_top, fit_y_bottom)
              if not 0.90 <= scale <= 1.16:
                  raise SystemExit(f'frame {index - 1} requires unsafe scale {scale:.4f}')

              frame = Image.fromarray(crop, 'RGBA')
              scaled_size = (max(1, round(frame.width * scale)), max(1, round(frame.height * scale)))
              frame = frame.resize(scaled_size, Image.Resampling.LANCZOS)
              paste_x = round(TARGET_FOOT[0] - local_foot_x * scale)
              paste_y = round(TARGET_FOOT[1] - local_foot_y * scale)
              cell = Image.new('RGBA', CELL, (0, 0, 0, 0))
              cell.alpha_composite(frame, (paste_x, paste_y))
              bbox = cell.getchannel('A').getbbox()
              if not bbox:
                  raise SystemExit(f'frame {index - 1} is empty after registration')
              if bbox[0] <= 0 or bbox[1] <= 0 or bbox[2] >= CELL[0] or bbox[3] >= CELL[1]:
                  raise SystemExit(f'frame {index - 1} touches/crosses its production cell: {bbox}')
              extracted.append(cell)
              metrics.append({
                  'frame': index - 1,
                  'sourceBBox': [x0, y0, x1, y1],
                  'bodyCoreHeight': body_height,
                  'uniformScale': round(float(scale), 6),
                  'targetFootAnchor': list(TARGET_FOOT),
                  'outputBBox': list(bbox),
              })

          sheet = Image.new('RGBA', (CELL[0] * GRID[0], CELL[1] * GRID[1]), (0, 0, 0, 0))
          for index, frame in enumerate(extracted):
              sheet.alpha_composite(frame, ((index % GRID[0]) * CELL[0], (index // GRID[0]) * CELL[1]))
          CANONICAL.parent.mkdir(parents=True, exist_ok=True)
          sheet.save(CANONICAL, format='PNG', optimize=True, compress_level=9)
          RUNTIME.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(CANONICAL, RUNTIME)
          extracted[0].save(PREVIEW, format='PNG', optimize=True, compress_level=9)

          output_sha = hashlib.sha256(CANONICAL.read_bytes()).hexdigest()
          PROVENANCE.write_text(json.dumps({
              'sourceCommit': '041c065268583ecdb5373bd52354b831ca34c605',
              'sourcePath': CANONICAL.as_posix(),
              'sourceSha256BeforeNormalization': source_sha,
              'sourceSize': {'width': SOURCE_EXPECTED[0], 'height': SOURCE_EXPECTED[1]},
              'outputSha256': output_sha,
              'outputSize': {'width': sheet.width, 'height': sheet.height},
              'grid': {'columns': GRID[0], 'rows': GRID[1]},
              'cell': {'width': CELL[0], 'height': CELL[1]},
              'policy': 'current-design-pixels-only-separate-register-uniform-frame-scale-no-redraw',
              'componentCoreAlphaThreshold': CORE_ALPHA,
              'targetBodyCoreHeight': TARGET_BODY_HEIGHT,
              'targetFootAnchor': list(TARGET_FOOT),
              'frames': metrics,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Manifest: current design stays authoritative; the normalized grid now has
          # true fixed cells matching the runtime actor/tool aspect ratio.
          manifest_path = ROOT / 'assets/art/game-scene/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '20260815-blue-scholar-motionfix2'
          blue = manifest['assets']['kongjwi']['blue-scholar']
          blue['sprite'] = {
              'frames': 30,
              'columns': 5,
              'rows': 6,
              'cell': {'width': CELL[0], 'height': CELL[1]},
              'sourceSize': {'width': sheet.width, 'height': sheet.height},
          }
          blue['placement'] = dict(manifest['placements']['kongjwi'])
          blue['animationProfile'] = 'blue-scholar-30f'
          blue['actionMode'] = 'magic-pour'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Renderer: blue scholar remains a special no-bucket magic motion, but the
          # action must still visibly affect the jar. Keep the tool hidden, restore
          # authored water stream/splash, and use the normalized grid.
          renderer_path = ROOT / 'assets/js/scene-renderer.js'
          renderer = renderer_path.read_text(encoding='utf-8')
          renderer = renderer.replace('20260815-blue-scholar-gridfix1', '20260815-blue-scholar-motionfix2')
          old = '''    if (isBlueScholar30f) clearLayer(layer(stack, "scene-water-stream"));
    else if (motionRig && chosen.stream.url) sprite(layer(stack, "scene-water-stream"), chosen.stream, s.waterStream);
    else fallbackWaterArc(layer(stack, "scene-water-stream"));'''
          new = '''    if (motionRig && chosen.stream.url) sprite(layer(stack, "scene-water-stream"), chosen.stream, s.waterStream);
    else fallbackWaterArc(layer(stack, "scene-water-stream"));'''
          if old not in renderer:
              raise SystemExit('expected blue-scholar stream suppression block not found')
          renderer = renderer.replace(old, new, 1)
          old = '''    if (isBlueScholar30f) clearLayer(layer(stack, "scene-water-splash"));
    else if (motionRig && chosen.splash.url) sprite(layer(stack, "scene-water-splash"), chosen.splash, s.waterSplash);
    else clearLayer(layer(stack, "scene-water-splash"));'''
          new = '''    if (motionRig && chosen.splash.url) sprite(layer(stack, "scene-water-splash"), chosen.splash, s.waterSplash);
    else clearLayer(layer(stack, "scene-water-splash"));'''
          if old not in renderer:
              raise SystemExit('expected blue-scholar splash suppression block not found')
          renderer = renderer.replace(old, new, 1)
          renderer_path.write_text(renderer, encoding='utf-8')

          # State contract: the 30 frames are a complete positive magic-cast motion.
          # They are NOT idle frames and the smiling tail is NOT a wrong reaction.
          state_path = ROOT / 'assets/js/scene-state-machine.js'
          state = state_path.read_text(encoding='utf-8')
          state = state.replace(
              'const BLUE_SCHOLAR_IDLE_FRAMES = [0, 1, 2, 3, 2, 1, 0];',
              'const BLUE_SCHOLAR_IDLE_FRAMES = [0, 1, 0];'
          )
          state = state.replace(
              'const BLUE_SCHOLAR_WRONG_FRAMES = [25, 26, 27, 28, 29];',
              'const BLUE_SCHOLAR_WRONG_FRAMES = [0];'
          )
          old = '''    this.renderer.setFlowPhase("prepare");
    this.schedule(() => this.renderer.setFlowPhase("pour"), 400);
    this.schedule(() => this.renderer.setFlowPhase("settle"), 1040);
    if (!hold) this.schedule(() => this.renderer.setFlowPhase("idle"), 1320);'''
          new = '''    const blueScholar = this.isBlueScholar30f();
    this.renderer.setFlowPhase("prepare");
    this.schedule(() => this.renderer.setFlowPhase("pour"), blueScholar ? 660 : 400);
    this.schedule(() => this.renderer.setFlowPhase("settle"), blueScholar ? 1120 : 1040);
    if (!hold) this.schedule(() => this.renderer.setFlowPhase("idle"), 1320);'''
          if old not in state:
              raise SystemExit('flow phase timing block not found')
          state = state.replace(old, new, 1)
          old = '''    if (this.isBlueScholar30f()) {
      this.playSequence("kongjwi", BLUE_SCHOLAR_FRAMES, 1320, { hold });
      this.startLeakLoop({ energetic: true });
      return;
    }'''
          new = '''    if (blueScholar) {
      this.playSequence("kongjwi", BLUE_SCHOLAR_FRAMES, 1320, { hold });
      this.renderer.setFrame("tool", 0);
      this.playSequence("waterStream", plan.waterStream || POUR_STREAM_FRAMES, 560, { delay: 660, hold });
      this.playSequence("waterSplash", plan.waterSplash || POUR_SPLASH_FRAMES, 430, { delay: 760, hold });
      this.startLeakLoop({ energetic: true });
      return;
    }'''
          if old not in state:
              raise SystemExit('blue scholar correct feedback block not found')
          state = state.replace(old, new, 1)
          state_path.write_text(state, encoding='utf-8')

          # Shop/wardrobe: do not revert this outfit to the old source-locked design.
          # Use a static preview extracted from frame 0 of the CURRENT 30f art.
          shop_js_path = ROOT / 'assets/js/shop-navigation.js'
          shop = shop_js_path.read_text(encoding='utf-8')
          shop = shop.replace('20260815-shop-static-cutout1', '20260815-blue-scholar-current-preview1')
          old_path = '`assets/art/source-locked/kongjwi/blue-scholar/base-cutout.png?v=${ASSET_VERSION}`'
          new_path = '`assets/art/game-scene-v2/kongjwi/blue-scholar/preview.png?v=${ASSET_VERSION}`'
          if old_path not in shop:
              raise SystemExit('old blue scholar shop preview mapping not found')
          shop = shop.replace(old_path, new_path, 1)
          shop = shop.replace(
              '// The shop and wardrobe are static previews. Always use the canonical\n// source-locked full-body cutouts here; gameplay pour sheets belong only to\n// the quiz animation renderer and must never be enlarged inside shop cards.',
              '// The shop and wardrobe use static full-body previews. Blue scholar must\n// stay visually identical to the current 30-frame gameplay art, so its preview\n// is extracted from that canonical current-design sheet rather than the legacy cutout.'
          )
          shop_js_path.write_text(shop, encoding='utf-8')

          shop_html_path = ROOT / 'shop.html'
          html = shop_html_path.read_text(encoding='utf-8')
          html = html.replace('20260815-shop-static-cutout1', '20260815-blue-scholar-current-preview1')
          shop_html_path.write_text(html, encoding='utf-8')

          # Builder must preserve the normalized authored 5x6 canonical sheet instead
          # of reverting its dimensions to the packed 1024x1536 source.
          builder_path = ROOT / 'scripts/build-kongjwi-pour-sheets.py'
          builder = builder_path.read_text(encoding='utf-8')
          builder = builder.replace(
              'expected_size = (1024, 1536) if skin == "blue-scholar" else (CELL[0] * FRAMES, CELL[1])',
              'expected_size = (256 * 5, 384 * 6) if skin == "blue-scholar" else (CELL[0] * FRAMES, CELL[1])'
          )
          builder = builder.replace(
              'manifest["version"] = "20260815-blue-scholar-30f1"',
              'manifest["version"] = "20260815-blue-scholar-motionfix2"'
          )
          old = '''    blue["sprite"] = {
        "frames": 30,
        "columns": 5,
        "rows": 6,
        "sourceSize": {"width": 1024, "height": 1536},
    }
    blue["placement"] = {"x": 150, "y": 260, "width": 657, "height": 820}
    blue["animationProfile"] = "blue-scholar-30f"'''
          new = '''    blue["sprite"] = {
        "frames": 30,
        "columns": 5,
        "rows": 6,
        "cell": {"width": 256, "height": 384},
        "sourceSize": {"width": 1280, "height": 2304},
    }
    blue["placement"] = dict(manifest["placements"]["kongjwi"])
    blue["animationProfile"] = "blue-scholar-30f"
    blue["actionMode"] = "magic-pour"'''
          if old not in builder:
              raise SystemExit('builder blue scholar manifest block not found')
          builder = builder.replace(old, new, 1)
          builder_path.write_text(builder, encoding='utf-8')

          # Update the existing shop regression test to enforce design consistency.
          shop_test_path = ROOT / 'tests/shop-outfit-preview-assets.test.mjs'
          test_text = shop_test_path.read_text(encoding='utf-8')
          test_text = test_text.replace(
              '"source-locked/kongjwi/blue-scholar/base-cutout.png",',
              '"game-scene-v2/kongjwi/blue-scholar/preview.png",'
          )
          needle = '  assert.doesNotMatch(source, /OUTFIT_ART[\\s\\S]*?game-scene\\/kongjwi\\/[^`"]+\\/pour-sheet\\.png/);'
          if needle not in test_text:
              raise SystemExit('shop preview regression assertion not found')
          test_text = test_text.replace(
              needle,
              needle + '\n  assert.doesNotMatch(source, /source-locked\\/kongjwi\\/blue-scholar\\/base-cutout\\.png/);',
              1
          )
          shop_test_path.write_text(test_text, encoding='utf-8')

          motion_test = ROOT / 'tests/blue-scholar-30f-motion.test.mjs'
          motion_test.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst read = path => fs.readFileSync(new URL(`../${path}`, import.meta.url));\nconst text = path => read(path).toString("utf8");\nconst pngSize = path => { const b = read(path); return [b.readUInt32BE(16), b.readUInt32BE(20)]; };\n\ntest("blue scholar canonical 30f sheet has true fixed 5x6 production cells", () => {\n  assert.deepEqual(pngSize("assets/art/game-scene-v2/kongjwi/blue-scholar/pour-sheet.png"), [1280, 2304]);\n  assert.deepEqual(pngSize("assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png"), [1280, 2304]);\n  assert.deepEqual(pngSize("assets/art/game-scene-v2/kongjwi/blue-scholar/preview.png"), [256, 384]);\n  const manifest = JSON.parse(text("assets/art/game-scene/manifest.json"));\n  const blue = manifest.assets.kongjwi["blue-scholar"];\n  assert.equal(blue.sprite.frames, 30);\n  assert.equal(blue.sprite.columns, 5);\n  assert.equal(blue.sprite.rows, 6);\n  assert.deepEqual(blue.sprite.cell, { width: 256, height: 384 });\n  assert.deepEqual(blue.sprite.sourceSize, { width: 1280, height: 2304 });\n  assert.deepEqual(blue.placement, manifest.placements.kongjwi);\n  assert.equal(blue.actionMode, "magic-pour");\n});\n\ntest("blue scholar current design is not reverted in shop and gameplay keeps visible water feedback", () => {\n  const shop = text("assets/js/shop-navigation.js");\n  const renderer = text("assets/js/scene-renderer.js");\n  const state = text("assets/js/scene-state-machine.js");\n  assert.match(shop, /game-scene-v2\\/kongjwi\\/blue-scholar\\/preview\\.png/);\n  assert.doesNotMatch(shop, /source-locked\\/kongjwi\\/blue-scholar\\/base-cutout\\.png/);\n  assert.doesNotMatch(renderer, /if \\(isBlueScholar30f\\) clearLayer\\(layer\\(stack, "scene-water-(?:stream|splash)"\\)\\)/);\n  assert.match(state, /BLUE_SCHOLAR_IDLE_FRAMES = \\[0, 1, 0\\]/);\n  assert.match(state, /BLUE_SCHOLAR_WRONG_FRAMES = \\[0\\]/);\n  assert.match(state, /playSequence\\("waterStream"[\\s\\S]*delay: 660/);\n  assert.match(state, /playSequence\\("waterSplash"[\\s\\S]*delay: 760/);\n});\n''', encoding='utf-8')
          PY

      - name: Validate normalized frames and runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for rel in [
              'assets/art/game-scene-v2/kongjwi/blue-scholar/pour-sheet.png',
              'assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png',
          ]:
              image = Image.open(rel).convert('RGBA')
              assert image.size == (1280, 2304), (rel, image.size)
              for i in range(30):
                  x = (i % 5) * 256
                  y = (i // 5) * 384
                  cell = image.crop((x, y, x + 256, y + 384))
                  bbox = cell.getchannel('A').getbbox()
                  assert bbox is not None, (rel, i, 'empty')
                  assert bbox[0] > 0 and bbox[1] > 0 and bbox[2] < 256 and bbox[3] < 384, (rel, i, bbox)
          preview = Image.open('assets/art/game-scene-v2/kongjwi/blue-scholar/preview.png').convert('RGBA')
          assert preview.size == (256, 384)
          PY
          node --check assets/js/scene-renderer.js
          node --check assets/js/scene-state-machine.js
          node --check assets/js/shop-navigation.js
          node --test tests/blue-scholar-30f-motion.test.mjs tests/shop-outfit-preview-assets.test.mjs
          grep -q '20260815-blue-scholar-motionfix2' assets/art/game-scene/manifest.json
          grep -q '20260815-blue-scholar-current-preview1' shop.html
          git diff --check

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-blue-scholar-30f-motion.yml
          git add \
            assets/art/game-scene-v2/kongjwi/blue-scholar/pour-sheet.png \
            assets/art/game-scene-v2/kongjwi/blue-scholar/preview.png \
            assets/art/game-scene-v2/kongjwi/blue-scholar/normalization.json \
            assets/art/game-scene/kongjwi/blue-scholar/pour-sheet.png \
            assets/art/game-scene/manifest.json \
            assets/js/scene-renderer.js \
            assets/js/scene-state-machine.js \
            assets/js/shop-navigation.js \
            scripts/build-kongjwi-pour-sheets.py \
            shop.html \
            tests/shop-outfit-preview-assets.test.mjs \
            tests/blue-scholar-30f-motion.test.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: normalize blue scholar 30-frame motion'
          git pull --rebase origin main
          git push origin HEAD:main
