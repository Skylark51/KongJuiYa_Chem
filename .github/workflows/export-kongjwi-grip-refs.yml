name: Export Kongjwi grip references

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-kongjwi-grip-refs.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify reference assets
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/art/game-scene-v2/kongjwi/underlayer/wood-grip-sheet.png
          test -f assets/art/game-scene-v2/kongjwi/night-court/summon-sheet.png
          test -f assets/art/kongjwi/kongjwi-underlayer-cutout.png
          test -f assets/art/game-scene-v2/kongjwi/underlayer/pour-sheet.png
          test -f assets/art/game-scene-v2/tools/wood/master.png
          test -f assets/art/game-scene-v2/tools/brass/master.png
          test -f assets/art/game-scene-v2/tools/celadon/master.png
          test -f assets/art/game-scene-v2/tools/moon/master.png
      - name: Upload grip references
        uses: actions/upload-artifact@v4
        with:
          name: kongjwi-grip-references
          if-no-files-found: error
          retention-days: 1
          path: |
            assets/art/game-scene-v2/kongjwi/underlayer/wood-grip-sheet.png
            assets/art/game-scene-v2/kongjwi/night-court/summon-sheet.png
            assets/art/kongjwi/kongjwi-underlayer-cutout.png
            assets/art/game-scene-v2/kongjwi/underlayer/pour-sheet.png
            assets/art/game-scene-v2/tools/wood/master.png
            assets/art/game-scene-v2/tools/brass/master.png
            assets/art/game-scene-v2/tools/celadon/master.png
            assets/art/game-scene-v2/tools/moon/master.png
