<!doctype html>
<html lang="ko" data-site-root="../../" data-subject="earth-science">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d2830">
  <meta name="description" content="콩쥐야 줘때써 지구과학 화석 구분 장독대">
  <title>화석 구분 장독대 | 콩쥐야 줘때써 - 지구과학편</title>
  <link rel="stylesheet" href="../../assets/css/subject-quiz.css?v=20260812-fossils1">
</head>
<body>
  <a class="skip-link" href="#quizMain">문제로 바로가기</a>
  <header class="quiz-topbar">
    <a class="quiz-brand" href="./?view=jars" aria-label="지구과학 장독대로 돌아가기">
      <span class="brand-seal" aria-hidden="true">地</span>
      <span><strong>콩쥐야 줘때써 - 지구과학편</strong><small>EARTH SCIENCE TRAINING</small></span>
    </a>
    <a class="exit-link" href="./?view=jars">장독대 선택</a>
  </header>

  <main id="quizMain" class="quiz-shell">
    <section class="quiz-heading" aria-labelledby="quizTitle">
      <p class="eyebrow">FOSSIL TRAINING JAR</p>
      <h1 id="quizTitle">화석 구분 장독대</h1>
      <p id="quizInstruction">화석 사진을 보고 알맞은 답을 고르세요.</p>
      <div class="quiz-progress" aria-label="문제 진행도">
        <span id="progressText">1 / 8</span>
        <div><i id="progressBar"></i></div>
      </div>
    </section>

    <section id="questionPanel" class="question-panel" aria-live="polite">
      <figure class="fossil-frame">
        <img id="fossilImage" src="" alt="">
        <figcaption id="fossilName" tabindex="-1"></figcaption>
      </figure>
      <div class="answer-panel">
        <p>이 화석을 구분해 보세요.</p>
        <div id="answerChoices" class="answer-choices"></div>
        <div id="feedback" class="feedback" role="status" hidden>
          <strong id="feedbackTitle"></strong>
          <p id="feedbackExplanation"></p>
        </div>
        <button id="nextButton" class="next-button" type="button" hidden>다음 문제</button>
      </div>
    </section>

    <section id="resultPanel" class="result-panel" hidden aria-labelledby="resultTitle">
      <p class="eyebrow">TRAINING COMPLETE</p>
      <h2 id="resultTitle" tabindex="-1">장독대 훈련 완료</h2>
      <strong id="resultScore">0 / 0</strong>
      <p id="resultSummary"></p>
      <div class="result-actions">
        <button id="retryButton" type="button">다시 풀기</button>
        <a href="./?view=records">기록 보기</a>
        <a href="./?view=jars">다른 장독대</a>
      </div>
    </section>
  </main>

  <script type="module" src="../../assets/js/earth-science-fossil-quiz.js?v=20260812-fossils1"></script>
</body>
</html>
